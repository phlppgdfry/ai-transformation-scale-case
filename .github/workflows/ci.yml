name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data is reproducible
        run: python scripts/make_data.py --check
      - name: Toolkit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Every number and table in docs and site is current
        run: python scripts/build.py --check
